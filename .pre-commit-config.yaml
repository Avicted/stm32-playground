# Runs in Docker on every commit, and all of it (make pre-commit-pr-run) on
# every push: `make hooks` once per clone.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # 1. General Hygiene Checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  # 2. Local Container-Native Hooks
  - repo: local
    hooks:
      # Secrets: the staged changes on commit; the whole history in the
      # manual stage (`make pre-commit-pr-run`), since --all-files has no
      # "staged" and a directory scan would walk the ignored build/.
      - id: gitleaks
        name: gitleaks (staged)
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: gitleaks-history
        name: gitleaks (history)
        entry: gitleaks git --redact --verbose
        language: system
        pass_filenames: false
        stages: [manual]

      # C/C++ Code Formatting: the Makefile owns what gets formatted and how
      - id: make-format
        name: make format
        entry: make format
        language: system
        pass_filenames: false
        types_or: [c, c++, header]

      # C/C++ Static Analysis
      - id: cppcheck
        name: cppcheck
        entry: cppcheck --language=c++ -I shared/include --enable=warning,style,performance,portability --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem --suppress=unusedStructMember --suppress=memsetClassFloat --suppress=constParameterPointer --suppress=constParameterCallback --suppress=useStlAlgorithm --suppress=cstyleCast --suppress=constVariable --suppress=constVariablePointer --suppress=constVariableReference --suppress=shadowVariable --suppress=variableScope --check-level=exhaustive
        language: system
        types_or: [c, c++, header]

      # Shell Linting
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]

      # Dockerfile Linting
      - id: hadolint
        name: Lint Dockerfile
        entry: hadolint
        language: system
        files: (^|/)Dockerfile.*$

      # Makefile Syntax Check
      - id: check-makefile-syntax
        name: Check Makefile Syntax
        entry: sh -c 'make -n >/dev/null'
        language: system
        files: ^Makefile$
        pass_filenames: false
